[project]
name = "autism-corpus"
version = "0.1.0"
description = "Reproducible data pipeline that builds a licensed, attributed autism knowledge corpus for RAG."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "aut-kb" }]
dependencies = [
    "httpx>=0.27",
    "trafilatura>=1.12",
    "selectolax>=0.3.21",
    "pymupdf>=1.24",
    "lingua-language-detector>=2.0",
    "syntok>=1.4",
    "tiktoken>=0.7",
    "pydantic>=2.7",
    "structlog>=24.1",
    "typer>=0.12",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "tenacity>=8.4",
    "lxml>=5.2",
]

[project.scripts]
autism-corpus = "autism_corpus.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-vcr>=1.0",
    "vcrpy>=6.0",
    "respx>=0.21",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autism_corpus"]

[tool.uv]
package = true


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PL", "RUF"]
ignore = ["PLR0913", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_generics = true
ignore_missing_imports = true
files = ["src/autism_corpus"]
